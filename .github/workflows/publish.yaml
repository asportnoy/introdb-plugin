name: '🚀 Publish Plugin'

permissions:
  contents: write  # Required to upload release assets and commit the manifest

on:
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version (e.g. 1.0.0.0 or v1.0.0.0)'
        required: true
        type: string

env:
  # Jellyfin version whose build is published to manifest.json
  MANIFEST_JELLYFIN: '12.2'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set version from release
        id: version
        env:
          RAW: ${{ github.event.release.tag_name || github.event.inputs.version }}
        run: |
          VERSION="${RAW#v}"
          # Ensure 4-part version (e.g. 1.0.0 -> 1.0.0.0)
          PARTS=$(echo "$VERSION" | tr '.' '\n' | wc -l)
          if [ "$PARTS" -eq 3 ]; then
            VERSION="${VERSION}.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build all targets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./build.sh --all
          # build.sh skips targets whose SDK is missing; make sure nothing was skipped
          for target in jellyfin-10.10 jellyfin-10.11 jellyfin-12.2 emby; do
            test -f "build/introdb_${VERSION}_${target}.zip" || { echo "Missing $target build"; exit 1; }
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-artifact
          retention-days: 30
          if-no-files-found: error
          path: |
            build/*.zip
            build/*.md5

  upload:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: build-artifact
          path: release-assets

      - name: Upload GH Release Assets
        uses: shogo82148/actions-upload-release-asset@8f6863c6c894ba46f9e676ef5cccec4752723c1e # v1.9.2
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: release-assets/*

      - name: Checkout repo for manifest update
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repo

      - name: Update plugin manifest
        env:
          # Pass the release body via env instead of interpolating it into the
          # shell script, so backticks / $ / quotes in release notes are not evaluated.
          CHANGELOG_RAW: ${{ github.event.release.body || 'See release notes' }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ZIP="introdb_${VERSION}_jellyfin-${MANIFEST_JELLYFIN}.zip"
          CHECKSUM=$(awk '{print $1}' "release-assets/${ZIP%.zip}.md5")
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CHANGELOG_JSON=$(printf '%s' "$CHANGELOG_RAW" | jq -Rs .)

          # Add new version to manifest (dedupe by version, sort newest-first)
          cd repo
          jq --argjson v "{
            \"version\": \"$VERSION\",
            \"changelog\": $CHANGELOG_JSON,
            \"targetAbi\": \"${MANIFEST_JELLYFIN}.0.0\",
            \"sourceUrl\": \"$SOURCE_URL\",
            \"checksum\": \"$CHECKSUM\",
            \"timestamp\": \"$TIMESTAMP\"
          }" '
            def vkey:
              (.version
               | sub("^v";"")
               | split(".")
               | map(tonumber? // 0));
            .[0].versions = ((.[0].versions + [$v]) | unique_by(.version) | sort_by(vkey) | reverse)
          ' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

      - name: Commit and push manifest
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "chore: update manifest for v${{ needs.build.outputs.version }}"
          git push
